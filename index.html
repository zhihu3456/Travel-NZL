<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d36"><meta name="robots" content="noindex,nofollow"><title>我的南岛旅行 · 访问密码</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23183d36'/%3E%3Cpath d='M8 48 28 14 39 33 46 23 58 48Z' fill='%23edf5eb'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.7 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#203b31;background:#e8eee7;min-height:100svh;display:grid;place-items:center}body:before{content:"";position:fixed;inset:0;background:linear-gradient(145deg,#183d36 0%,#295846 38%,#849f86 100%);z-index:-2}body:after{content:"";position:fixed;inset:30% 0 0;clip-path:polygon(0 65%,18% 22%,31% 51%,51% 0,70% 45%,81% 20%,100% 64%,100% 100%,0 100%);background:#edf3e320;z-index:-1}.card{width:min(440px,calc(100vw - 36px));padding:42px 36px 32px;background:#fcfdf9;border:1px solid #ffffff80;border-radius:18px;box-shadow:0 20px 100px #102b3b30}.mark{width:48px;height:48px;border-radius:14px;background:#245a4d;color:#f3f7ef;display:grid;place-items:center;font-size:33px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:2px;color:#6f8274;font-weight:650;margin:0 0 8px}h1{font-size:30px;line-height:1.3;letter-spacing:-1px;margin:0 0 12px}.date{font-size:14px;color:#718277;margin:0 0 26px}.intro{color:#667b6d;font-size:15px;margin:0 0 28px}label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}.input-wrap{display:flex;border:1px solid #cddbcf;border-radius:8px;overflow:hidden;background:white}.input-wrap:focus-within{outline:3px solid #bcd6bd}input{font:inherit;width:100%;padding:12px 13px;border:0;outline:0;color:#203b31;background:white;min-width:0}.toggle{font:inherit;font-size:12px;border:0;background:white;color:#6f8274;cursor:pointer;padding:0 13px;white-space:nowrap}.unlock{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:8px;background:#245a4d;color:white;padding:13px;width:100%;margin-top:16px;cursor:pointer}.unlock:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:3px solid #7ab0ca;outline-offset:3px}#message{font-size:13px;color:#a04b3b;min-height:24px;margin:12px 0 4px}.foot{border-top:1px solid #e4eae1;font-size:12px;color:#869286;padding-top:17px;margin:13px 0 0}#viewer{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:10}#lock{position:fixed;top:21px;left:calc(50% - 38px);z-index:20;border:1px solid #ceddce;border-radius:7px;background:#fffffff0;color:#315c46;font:13px "Segoe UI","Microsoft YaHei",sans-serif;padding:9px 12px;box-shadow:0 2px 10px #183d3610;cursor:pointer}[hidden]{display:none!important}@media(max-width:800px){#lock{left:auto;top:auto;right:15px;bottom:67px}.card{padding:32px 26px}}
</style></head>
<body><main class="card" id="gate"><div class="mark" aria-hidden="true">△</div><p class="eyebrow">AOTEAROA · NEW ZEALAND</p><h1>我的南岛旅行</h1><p class="date">2026.12.07 – 12.17 · 11 天自驾</p><p class="intro">山川之间，和朋友相见。<br>输入共享密码，查看完整行程与住宿导航。</p><form id="unlockForm"><label for="password">访问密码</label><div class="input-wrap"><input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus><button type="button" class="toggle" id="toggle" aria-label="显示密码">显示</button></div><button class="unlock" id="unlock" type="submit">解锁行程</button><p id="message" role="status" aria-live="polite"></p></form><p class="foot">密码由行程所有者单独提供。关闭或锁定页面后，需要再次输入。</p><p style="margin:14px 0 0;text-align:center;font-size:12px;color:#6f8274">credit to 小观音</p></main><iframe id="viewer" title="我的南岛完整行程" allow="clipboard-write" hidden></iframe><button id="lock" hidden>锁定行程</button>
<script>
const form=document.getElementById('unlockForm'),input=document.getElementById('password'),button=document.getElementById('unlock'),message=document.getElementById('message'),viewer=document.getElementById('viewer'),lock=document.getElementById('lock');
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('toggle').addEventListener('click',()=>{const b=document.getElementById('toggle');input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'显示':'隐藏';b.setAttribute('aria-label',input.type==='password'?'显示密码':'隐藏密码')});
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='正在解锁…';message.textContent='';try{if(!crypto.subtle){message.textContent='请使用 HTTPS 地址或最新版浏览器访问。';return}const response=await fetch('./trip.enc.json',{cache:'no-store'});if(!response.ok)throw new Error('network');const data=await response.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(data.iv)},key,decode(data.data))}catch{message.textContent='密码不正确，请核对后重试。';input.select();return}viewer.srcdoc=new TextDecoder().decode(plain);input.value='';input.type='password';document.getElementById('toggle').textContent='显示';viewer.hidden=false;lock.hidden=false;document.getElementById('gate').hidden=true;document.title='我的南岛旅行 · 2026.12.07–12.17';}catch{message.textContent='行程加载失败，请检查网络后重试。'}finally{button.disabled=false;button.textContent='解锁行程'}});
lock.addEventListener('click',()=>{viewer.hidden=true;viewer.srcdoc='';lock.hidden=true;document.getElementById('gate').hidden=false;message.textContent='';document.title='我的南岛旅行 · 访问密码';input.focus()});
</script></body></html>
